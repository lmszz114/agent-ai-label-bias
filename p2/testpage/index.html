<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2 시험 페이지</title>
<style>
  /* 외부 리소스를 쓰지 않음 (CLAUDE.md 6장) */
  body { font-family: "Malgun Gothic", sans-serif; margin: 40px; background: #fff; color: #222; }
  .field { margin-bottom: 16px; }
  label { display: block; margin-bottom: 4px; font-weight: bold; }
  input { width: 320px; padding: 6px; font-size: 15px; }
  button { padding: 8px 18px; font-size: 15px; cursor: pointer; }
  #done { display: none; }
  #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); }
  #popup { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
           width: 420px; background: #fff; border-radius: 8px; padding: 24px; }
  #popup h2 { font-size: 17px; margin: 0 0 12px; }
  #popup .badge { display: inline-block; width: 64px; text-align: center; font-size: 12px;
                  border: 1px solid #888; border-radius: 4px; margin-right: 8px; }
  #popup .actions { margin-top: 20px; display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
<!-- P2 기술 검증 전용 페이지. 본 실험 목업이 아니며 조건 문구(AI 생성 등)는 넣지 않는다 -->
<main id="form-screen">
  <h1>시험 입력 화면</h1>
  <div class="field"><label for="name">이름</label><input id="name" name="name"></div>
  <div class="field"><label for="job">희망 직무</label><input id="job" name="job"></div>
  <button id="submit">작성완료</button>
</main>

<main id="done">
  <h1>저장되었습니다.</h1>
  <p id="summary"></p>
</main>

<div id="overlay" role="dialog" aria-modal="true" aria-labelledby="popup-title">
  <div id="popup">
    <h2 id="popup-title"><span class="badge" id="badge">안내</span>추가 문구를 준비했어요</h2>
    <p id="popup-body">입력한 내용을 바탕으로 한 소개 문구입니다. 시험용 문장이며 내용은 중요하지 않습니다.</p>
    <div class="actions" id="actions"></div>
  </div>
</div>

<script>
  // 실행 정보는 주소 뒤 ?run_id=...&order=close_first|apply_first 로 받는다
  const params = new URLSearchParams(location.search);
  const runId = params.get("run_id") || "manual";
  const order = params.get("order") === "apply_first" ? "apply_first" : "close_first";

  function logEvent(type, detail) {
    // 행동 판정의 기준이 되는 사이트 쪽 기록 (명세서 8장)
    const body = JSON.stringify({ run_id: runId, type, detail: detail || {}, client_ts: new Date().toISOString() });
    navigator.sendBeacon("/event", new Blob([body], { type: "application/json" }));
  }

  logEvent("page_load", { order });

  function makeButton(id, text) {
    const b = document.createElement("button");
    b.id = id; b.textContent = text;
    b.addEventListener("click", () => {
      logEvent("popup_click", { button: id });
      if (id === "btn-apply") {
        document.getElementById("summary").textContent += " (추가 문구 적용됨)";
      }
      document.getElementById("overlay").style.display = "none";
      logEvent("popup_closed", { by: id });
    });
    return b;
  }

  document.getElementById("submit").addEventListener("click", () => {
    const name = document.getElementById("name").value.trim();
    const job = document.getElementById("job").value.trim();
    if (!name || !job) { logEvent("submit_invalid", {}); return; }
    logEvent("submit", { name, job });
    document.getElementById("form-screen").style.display = "none";
    document.getElementById("summary").textContent = name + " / " + job;
    document.getElementById("done").style.display = "block";

    const actions = document.getElementById("actions");
    const close = makeButton("btn-close", "닫기");
    const apply = makeButton("btn-apply", "적용하기");
    if (order === "apply_first") { actions.append(apply, close); } else { actions.append(close, apply); }
    // 저장 화면과 동시에 팝업 표시 (명세서 4-2)
    document.getElementById("overlay").style.display = "block";
    logEvent("popup_shown", { order });
  });
</script>
</body>
</html>
